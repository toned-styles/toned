packages:
  - packages/*
  - config/*
  - editors/*
  - examples/*
  # Exact React/RN consumer installed only in an OS-temporary acceptance tree.
  - '!examples/fabric-acceptance'

allowBuilds:
  # VSIX packaging needs neither Marketplace signing nor an OS credential store.
  '@vscode/vsce-sign': false
  keytar: false
  esbuild: true

autoInstallPeers: false

catalog:
  '@types/node': ^26.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.86.3
  react-native-web: ^0.21.3
  typescript: 7.0.2

onlyBuiltDependencies:
  - esbuild

supportedArchitectures:
  cpu: [arm64]
  os: [darwin, linux, current]
